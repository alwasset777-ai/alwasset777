<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>انضم لشبكة الوسيط 777 — عرض 777 للأوائل</title>
  <meta name="description" content="شبكة الوسيط 777: الوكالات، الوسطاء، المقاولات، التشطيب، المستثمرون، الموثقون والجمعيات. 6 أشهر مجانية، و7 الأوائل مجاناً مدى الحياة.">
  <meta name="theme-color" content="#000000">
  <meta property="og:type" content="website">
  <meta property="og:title" content="عرض 777 للأوائل — شبكة الوسيط 777">
  <meta property="og:description" content="7 الأوائل مجاناً مدى الحياة · 70 الموالين -50% · 700 الموالين -25% · 6 أشهر مجانية للجميع.">
  <meta property="og:image" content="https://alwasset777-ai.github.io/alwasset777/bureau/icons/icon-512.png?v=9">
  <link rel="icon" href="icons/icon-192.png?v=9" type="image/png">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { padding-bottom: 40px; }
    .jw { max-width: 1080px; margin: 0 auto; padding: 14px 16px; }
    .j-hero { position: relative; overflow: hidden; border-radius: 24px; padding: 24px 22px; color: #fff; margin-bottom: 16px;
      background: radial-gradient(ellipse at 85% 0%, #5a0f1e, transparent 60%), linear-gradient(150deg, #000, #1c1c1c 60%, #3a0b14); box-shadow: 0 14px 40px -12px rgba(58,11,20,.5); }
    .j-hero::after { content: '777'; position: absolute; inset-inline-end: -10px; bottom: -40px; font-size: 160px; font-weight: 900; color: rgba(255,255,255,.06); }
    .j-top { display: flex; align-items: center; gap: 14px; }
    .j-top img { height: 62px; width: 62px; border-radius: 50%; background: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
    .j-top h1 { margin: 0; font-size: 23px; } .j-top small { color: rgba(255,255,255,.75); }
    .j-tiers { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 18px; position: relative; z-index: 1; }
    .j-tiers div { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 12px; }
    .j-tiers b { display: block; font-size: 15px; } .j-tiers span { color: #ffd166; font-weight: 800; font-size: 13.5px; }
    .j-cta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; position: relative; z-index: 1; }
    .j-cta .btn:not(.wa) { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.2); }
    .j-tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 4px 0 14px; padding-bottom: 2px; }
    .j-tabs button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px; font: inherit; font-weight: 700; cursor: pointer; }
    .j-tabs button.on { background: #111; color: #fff; border-color: #111; }
    .j-k { padding: 18px; }
    .j-k h2 { margin: 0 0 4px; font-size: 20px; }
    .j-k p { margin: 0 0 12px; color: var(--muted); }
    .j-rows { display: grid; gap: 8px; }
    .j-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); }
    .j-row i { font-style: normal; font-size: 24px; } .j-row b { font-size: 15px; } .j-row small { display: block; color: var(--muted); }
    .j-row .left { font-weight: 900; color: #c8102e; white-space: nowrap; text-align: center; }
    .j-row .left small { color: var(--muted); font-weight: 600; }
    .j-row.full { opacity: .5; } .j-row.full .left { color: var(--muted); }
    .j-bar { height: 6px; border-radius: 9px; background: var(--line); overflow: hidden; grid-column: 1 / -1; }
    .j-bar span { display: block; height: 100%; background: linear-gradient(90deg, #c8102e, #ffb703); }
    .j-vid { display: flex; gap: 14px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
    .j-vid video { width: 160px; aspect-ratio: 9/16; border-radius: 14px; background: #000; }
    .j-steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 14px; }
    .j-steps div { padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
    .j-steps b { color: #c8102e; font-size: 22px; display: block; }
    .j-foot { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 26px; }
  </style>
</head>
<body>
  <div class="jw" id="jb"><div class="card empty">⏳ جاري التحميل…</div></div>
  <div class="j-foot">مجموعة الوسيط 777 للخدمات العقارية · مكناس · مع الوسيط… حلك بسيط</div>
  <script src="../app/config.js" onerror="void 0"></script>
  <script>
  (function () {
    'use strict';
    // صفحة عمومية: عرض 777 للأوائل + عداد المقاعد الباقية فكل فئة (الأرقام من الدالة w777_offer_counts، بلا معلومات شخصية)
    const C = window.__ALWASSET_SUPABASE__ || {};
    const URL_ = String(C.url || '').replace(/\/+$/, ''), KEY = C.anonKey || '';
    const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const APP = new URL('./', location.href).href, WA = '212777777959';
    const K = [
      ['agency', '🏢', 'الوكالات العقارية', 'وكالة', 'عقاراتك كتبان لجميع الأعضاء (بلا معلومات المالك) والعمولة 50/50.'],
      ['broker', '🤝', 'الوسطاء العقاريون', 'وسيط', 'خدم مع الوكالات وشارك العقارات والزبناء بأمان.'],
      ['contractor', '🏗️', 'شركات المقاولات', 'شركة مقاولات', 'كتبان فالدليل للوكالات والمستثمرين والجمعيات اللي كيقلبو على مقاول.'],
      ['finishing', '🎨', 'شركات التشطيب', 'شركة تشطيب', 'زبناء جداد من الوكالات والمشترين اللي محتاجين تشطيب وديكور.'],
      ['investor', '💼', 'المستثمرون', 'مستثمر', 'فرص استثمار عقاري: تمويل، شراكة، شراء وكراء طويل.'],
      ['notary', '🖋️', 'الموثقون', 'موثق', 'كتقترحو مع أقرب عقار، وكتوصلك الاستشارات وطلبات التوثيق.'],
      ['association', '🏘️', 'الجمعيات السكنية', 'جمعية', 'لقى الأرض، المقاول، الموثق والتمويل لمشروع السكن ديال أعضائك.'],
    ];
    const sel = new URLSearchParams(location.search).get('k') || 'agency';
    let cur = K.some(k => k[0] === sel) ? sel : 'agency', counts = {};
    const cnt = (kind, zone) => counts[kind + '|' + zone] || 0;
    const wa = k => `https://wa.me/${WA}?text=${encodeURIComponent(`السلام عليكم، بغيت ننضم لشبكة الوسيط 777 (${k[2]}) ونستافد من عرض 777 للأوائل.`)}`;
    function rows(k) {
      const n = cnt(k[0], 'ma');
      const r = (ic, t, s, from, to) => {
        const left = Math.max(0, to - Math.max(n, from)), size = to - from, full = n >= to;
        return `<div class="j-row${full ? ' full' : ''}"><i>${ic}</i><div><b>${t}</b><small>${s}</small></div>
          <div class="left">${full ? 'تعمّرو' : `${left}<small> مقعد باقي</small>`}</div>
          <div class="j-bar"><span style="width:${Math.round(Math.min(size, Math.max(0, n - from)) * 100 / size)}%"></span></div></div>`;
      };
      let h = r('🥇', `${k[3]} من 7 الأوائل`, 'التطبيق مجاني مدى الحياة', 0, 7) + r('🥈', '70 الموالين', 'تخفيض 50% مدى الحياة', 7, 77) + r('🥉', '700 الموالين', 'تخفيض 25% مدى الحياة', 77, 777)
        + `<div class="j-row"><i>🎟️</i><div><b>كل من تسجّل بعدهم</b><small>تخفيض 25% لمدة 4 سنوات</small></div><div class="left">∞</div></div>`;
      if (k[0] === 'agency') {
        const o = cnt('agency', 'out');
        h += `<div class="j-row${o >= 70 ? ' full' : ''}"><i>🌍</i><div><b>70 وكالة خارج المغرب</b><small>مجاني مدى الحياة</small></div><div class="left">${o >= 70 ? 'تعمّرو' : `${70 - o}<small> مقعد باقي</small>`}</div>
          <div class="j-bar"><span style="width:${Math.round(Math.min(70, o) * 100 / 70)}%"></span></div></div>`;
      }
      return h;
    }
    function draw() {
      const k = K.find(x => x[0] === cur);
      $('#jb').innerHTML = `
        <div class="j-hero"><div class="j-top"><img src="icons/logo.png" alt=""><div><h1>🎁 عرض 777 للأوائل</h1><small>شبكة الوسيط 777 — 7 فئات مهنية فتطبيق واحد · عدد المشتركين غير محدود</small></div></div>
          <div class="j-tiers"><div><b>🥇 7 الأوائل</b><span>مجاني مدى الحياة</span></div><div><b>🥈 70 الموالين</b><span>-50% مدى الحياة</span></div>
            <div><b>🥉 700 الموالين</b><span>-25% مدى الحياة</span></div><div><b>🎟️ من بعد</b><span>-25% لمدة 4 سنوات</span></div>
            <div><b>🎁 الجميع</b><span>6 أشهر مجانية</span></div><div><b>🌍 70 وكالة خارج المغرب</b><span>مجاني مدى الحياة</span></div></div>
          <div class="j-cta"><a class="btn wa" href="${wa(k)}" target="_blank" rel="noopener">💬 انضم عبر واتساب</a><a class="btn" href="${esc(APP)}">📱 افتح التطبيق</a><a class="btn" href="tuto/">🎬 الفيديوهات</a></div></div>
        <div class="j-tabs" id="jt">${K.map(x => `<button data-k="${x[0]}" class="${x[0] === cur ? 'on' : ''}">${x[1]} ${x[2]}</button>`).join('')}</div>
        <div class="card j-k"><h2>${k[1]} ${k[2]}</h2><p>${k[4]} الترتيب حسب تاريخ التسجيل فهاد الفئة · المسجلين: ${cnt(k[0], 'ma') + cnt(k[0], 'out')}</p>
          <div class="j-rows">${rows(k)}</div>
          <div class="j-vid"><video src="tuto/net-${k[0]}.mp4" poster="tuto/net-${k[0]}.jpg" controls playsinline preload="none"></video>
            <div><b>شوف شنو كتربح كـ${k[3]}</b><p class="muted" style="margin:6px 0 10px">دقيقة واحدة على الشبكة والتطبيق.</p><a class="btn wa" href="${wa(k)}" target="_blank" rel="noopener">💬 حجز مقعدي</a></div></div></div>
        <div class="j-steps"><div><b>01</b>افتح التطبيق و«أضف إلى الشاشة الرئيسية» — بلا متجر تطبيقات.</div>
          <div><b>02</b>راسل المكتب على واتساب: كنعطيوك الرمز وكلمة السر ديال حسابك.</div>
          <div><b>03</b>وافق على قانون التطبيق: نهار الموافقة هو اللي كيحدد رقم مقعدك.</div></div>
        <p class="muted" style="text-align:center;margin-top:14px">📞 <span dir="ltr">0777777959 · 0777777848</span></p>`;
      $$('#jt [data-k]').forEach(b => b.onclick = () => { cur = b.dataset.k; history.replaceState(null, '', '?k=' + cur); draw(); });
    }
    draw();
    if (URL_ && KEY) fetch(`${URL_}/rest/v1/rpc/w777_offer_counts`, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: '{}' })
      .then(r => r.ok ? r.json() : []).then(l => { (Array.isArray(l) ? l : []).forEach(x => { counts[x.kind + '|' + (x.zone || 'ma')] = Number(x.n) || 0; }); draw(); }).catch(() => {});
  })();
  </script>
</body>
</html>
